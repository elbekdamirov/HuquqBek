<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0d1210"/>
<meta name="description" content="HuquqBek — özbek tilidagi interaktiv 3D sud simulyatori: suhbat, dalillar, eʼtirozlar va ökuv qarori."/>
<meta name="application-name" content="HuquqBek"/>
<meta property="og:title" content="HuquqBek · Huquqiy o‘quv yo‘nalishlari"/>
<meta property="og:description" content="Huquqni amalda örganiş uçun 3D sud zali."/>

<link rel="icon" type="image/svg+xml" href="/brand/huquqbek-courthouse.svg"/>
<link rel="apple-touch-icon" href="/brand/courthouse-192.png"/>
<title>HuquqBek · Huquqiy o‘quv yo‘nalishlari</title>
<style>
  html,body{margin:0;background:#0d1210}
  #hb-boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#1f3d2b,#0d1210);color:#d5cdbb;font:16px 'Segoe UI',system-ui,sans-serif;z-index:1}
  #hb-boot div{text-align:center}
  #hb-boot .boot-seal{position:relative;display:grid;place-items:center;width:96px;height:96px;margin:auto}
  .boot-seal::before,.boot-seal::after{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid #e8dcc455}
  .boot-seal::after{inset:5px;border:2px solid transparent;border-top-color:#5fbf86;border-bottom-color:#8b5cf6;animation:hb-orbit 2s ease-in-out infinite}
  #hb-boot b{display:block;font:400 48px/.96 Georgia,serif;letter-spacing:-.055em;color:#efe7d6;margin:22px 0 12px}
  #hb-boot i{display:block;width:150px;height:2px;margin:22px auto 0;background:linear-gradient(90deg,transparent,#8b5cf6,transparent)}
  @keyframes hb-orbit{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.boot-seal::after{animation:none}}
</style>
</head>
<body>
<div id="hb-boot" role="status"><div><span class="boot-seal"><img src="/brand/huquqbek-courthouse.svg" width="60" height="60" alt=""/></span><b>HuquqBek</b>Interaktiv sud simulyatori yuklanmoqda…<i></i></div></div>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
